name: gradle-android-rustdroid-receipt
on: { workflow_dispatch: }
jobs:
  apk-receipt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew assembleDebug
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: test_avd
          profile: pixel_5
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only
          script: emulator -list-avds
      - id: receipt
        uses: OthmaneBlial/rustdroid@964ed16d32d4fa12b52dea21b95484a7b96e9854
        with:
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          artifacts-dir: artifacts/rustdroid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustdroid-receipt
          path: ${{ steps.receipt.outputs.receipt-dir }}
