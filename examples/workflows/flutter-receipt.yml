name: flutter-rustdroid-receipt
on: { workflow_dispatch: }
jobs:
  apk-receipt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          flutter pub get
          flutter build apk --debug
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provision the documented Android 35 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: test_avd
          profile: pixel_5
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only
          # The provisioner stops the emulator after this step. Start the
          # persistent AVD explicitly before invoking the receipt action.
          script: "true"
      - name: Start the provisioned Android 35 AVD
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          emulator="$sdk_root/emulator/emulator"
          adb="$sdk_root/platform-tools/adb"
          test -x "$emulator"
          test -x "$adb"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$emulator" -avd test_avd -no-snapshot -no-window -gpu swiftshader_indirect \
            -no-audio -no-boot-anim -read-only > "$RUNNER_TEMP/rustdroid-flutter-emulator.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if "$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -qx '1'; then
              "$adb" -s emulator-5554 shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          "$adb" devices || true
          tail -n 120 "$RUNNER_TEMP/rustdroid-flutter-emulator.log" || true
          exit 1
      - id: receipt
        uses: OthmaneBlial/rustdroid@964ed16d32d4fa12b52dea21b95484a7b96e9854
        with:
          apk-path: build/app/outputs/flutter-apk/app-debug.apk
          artifacts-dir: artifacts/rustdroid
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rustdroid-receipt
          path: ${{ steps.receipt.outputs.receipt-dir }}
      - name: Stop the provisioned Android 35 AVD
        if: always()
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$sdk_root/platform-tools/adb" -s emulator-5554 emu kill || true
