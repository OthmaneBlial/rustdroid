# Copy to .github/workflows/android-receipt.yml in a Gradle Android repository.
# Adapt the Java version, Gradle task and APK path to that repository.
# This example is prepared, not an independently verified adopter integration.
name: Android APK receipt
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the application
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provision an AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: test_avd
          profile: pixel_5
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only
          script: 'true'
      - name: Start the provisioned AVD for the receipt step
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_root/emulator/emulator" -avd test_avd -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if "$sdk_root/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -qx '1'; then
              "$sdk_root/platform-tools/adb" -s emulator-5554 shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/emulator.log"
          exit 1
      - id: receipt
        # API 35 contract: actions/runs/34202434356 (source candidate 0.3.2).
        uses: OthmaneBlial/rustdroid@ce727e89711958fc09daa57ac17d90bf8743e8c3
        with:
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          host-avd-name: test_avd
          artifacts-dir: artifacts/rustdroid
          duration-secs: '5'
          keep-alive: 'false'
      - name: Retain reports, including failed receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-receipt
          path: artifacts/rustdroid
          retention-days: 7
          if-no-files-found: warn
      - name: Stop the dedicated runner emulator
        if: always()
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/platform-tools/adb" -s emulator-5554 emu kill || true
