<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RustDroid host-fast launch receipt</title>
  <desc id="desc">A recorded Linux fixture run with boot, install, launch, and artifact timings.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a1a"/>
      <stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="0.55" stop-color="#e97237"/>
      <stop offset="1" stop-color="#c44f3e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bb3a7" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#07100f"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <path d="M0 0H1280V78H0Z" fill="#0e1514"/>
  <rect y="76" width="1280" height="3" fill="url(#stripe)"/>

  <g font-family="Menlo, Monaco, Consolas, monospace">
    <text x="64" y="48" fill="#f3efe5" font-size="25" font-weight="700" letter-spacing="5">RUSTDROID</text>
    <text x="330" y="48" fill="#95a8a0" font-size="14" letter-spacing="2">LOCAL APK LAUNCH RECEIPT</text>
    <text x="1041" y="48" fill="#d8e2d8" font-size="14" letter-spacing="1">FIXTURE / 0042</text>

    <rect x="62" y="120" width="1156" height="490" rx="8" fill="url(#panel)" stroke="#44544d" stroke-width="1"/>
    <rect x="62" y="120" width="1156" height="42" rx="8" fill="#1d2724"/>
    <circle cx="88" cy="141" r="6" fill="#df664a"/>
    <circle cx="108" cy="141" r="6" fill="#f2b655"/>
    <circle cx="128" cy="141" r="6" fill="#7aa88b"/>
    <text x="158" y="146" fill="#a8b8af" font-size="13">host-fast / linux reference / 2026-04-02</text>

    <text x="98" y="208" fill="#f5a623" font-size="15" font-weight="700">$</text>
    <text x="124" y="208" fill="#f1f4ef" font-size="15">rustdroid --profile host-fast --host-avd-name test_avd run</text>
    <text x="124" y="233" fill="#c8d4cd" font-size="15">tests/fixtures/apks/launch-success.apk --artifacts-dir artifacts/rustdroid</text>

    <line x1="98" y1="266" x2="1182" y2="266" stroke="#3d4d46"/>
    <text x="98" y="305" fill="#95a8a0" font-size="13" letter-spacing="2">PREFLIGHT</text>
    <text x="272" y="305" fill="#79c692" font-size="14">APK METADATA READ</text>
    <text x="513" y="305" fill="#79c692" font-size="14">X86_64 READY</text>
    <text x="726" y="305" fill="#79c692" font-size="14">ARTIFACTS ENABLED</text>

    <g transform="translate(98 348)">
      <rect width="234" height="132" rx="5" fill="#0b1311" stroke="#42534a"/>
      <rect width="6" height="132" rx="3" fill="#f5a623"/>
      <text x="26" y="33" fill="#9cafa6" font-size="12" letter-spacing="2">BOOT / HOST AVD</text>
      <text x="26" y="81" fill="#f2f5ef" font-size="38" font-weight="700">65.5<tspan font-size="17" fill="#a4b6ad">s</tspan></text>
      <text x="26" y="109" fill="#72867c" font-size="12">cold reference run</text>
    </g>
    <g transform="translate(352 348)">
      <rect width="234" height="132" rx="5" fill="#0b1311" stroke="#42534a"/>
      <rect width="6" height="132" rx="3" fill="#e97237"/>
      <text x="26" y="33" fill="#9cafa6" font-size="12" letter-spacing="2">INSTALL / APK SET</text>
      <text x="26" y="81" fill="#f2f5ef" font-size="38" font-weight="700">12.4<tspan font-size="17" fill="#a4b6ad">s</tspan></text>
      <text x="26" y="109" fill="#72867c" font-size="12">launch-success.apk</text>
    </g>
    <g transform="translate(606 348)">
      <rect width="234" height="132" rx="5" fill="#0b1311" stroke="#42534a"/>
      <rect width="6" height="132" rx="3" fill="#d96041"/>
      <text x="26" y="33" fill="#9cafa6" font-size="12" letter-spacing="2">LAUNCH / FOREGROUND</text>
      <text x="26" y="81" fill="#f2f5ef" font-size="38" font-weight="700">8.4<tspan font-size="17" fill="#a4b6ad">s</tspan></text>
      <text x="26" y="109" fill="#72867c" font-size="12">activity resolved</text>
    </g>
    <g transform="translate(860 348)">
      <rect width="322" height="132" rx="5" fill="#0b1311" stroke="#5d845f"/>
      <rect width="6" height="132" rx="3" fill="#79c692" filter="url(#glow)"/>
      <text x="26" y="33" fill="#9cafa6" font-size="12" letter-spacing="2">RESULT</text>
      <text x="26" y="79" fill="#8fe0a6" font-size="25" font-weight="700">LAUNCH VERIFIED</text>
      <text x="26" y="109" fill="#b7c9bd" font-size="12">com.rustdroid.fixture.launch</text>
    </g>

    <line x1="98" y1="522" x2="1182" y2="522" stroke="#3d4d46"/>
    <text x="98" y="557" fill="#9cafa6" font-size="13" letter-spacing="2">RECEIPT</text>
    <text x="226" y="557" fill="#f3efe5" font-size="14">86.3s total</text>
    <text x="406" y="557" fill="#7d9288" font-size="14">run-summary.json</text>
    <text x="626" y="557" fill="#7d9288" font-size="14">run-report.html</text>
    <text x="824" y="557" fill="#7d9288" font-size="14">logcat.txt</text>
    <text x="1048" y="557" fill="#f5a623" font-size="14">EVIDENCE, NOT GUESSWORK</text>

    <text x="64" y="672" fill="#91a49b" font-size="13">A reference cold host-fixture measurement. Reproduce it with the documented Linux host setup; timing varies by hardware and AVD image.</text>
  </g>
</svg>
