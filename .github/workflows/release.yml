name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve and validate candidate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/v\1/p' Cargo.toml | head -n 1)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Release tag does not match Cargo version: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release archive
        run: ./scripts/package-release.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      - name: Generate release notes and install snippet
        run: ./scripts/generate-release-notes.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}"

      - name: Package the public first-run fixture
        run: bash scripts/package-public-fixture.sh

      - name: Verify clean-container installation
        run: RUSTDROID_REQUIRE_CONTAINER=1 ./scripts/verify-release-install-container.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/rustdroid-${{ matrix.target }}.tar.gz
            dist/rustdroid-${{ matrix.target }}.tar.gz.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rustdroid-${{ matrix.target }}
          path: |
            dist/rustdroid-${{ matrix.target }}.tar.gz
            dist/rustdroid-${{ matrix.target }}.tar.gz.sha256
            dist/install-snippet.txt
            dist/release-notes.md
            dist/rustdroid-fixture-*.apk
            dist/rustdroid-fixture-*.apk.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/rustdroid-${{ matrix.target }}.tar.gz
            dist/rustdroid-${{ matrix.target }}.tar.gz.sha256
            dist/install-snippet.txt
            dist/rustdroid-fixture-*.apk
            dist/rustdroid-fixture-*.apk.sha256
