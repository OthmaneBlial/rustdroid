name: action-contract

on:
  push:
    paths:
      - action.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/fixtures/**
      - .github/workflows/action-contract.yml
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 3"

concurrency:
  group: action-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checked-in-action-runs-public-fixture:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Provision the documented Android 35 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: test_avd
          profile: pixel_5
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only
          # This action owns its emulator process and stops it at the end of
          # the step. It leaves the AVD definition ready for the explicit
          # persistent process below, where the composite action can use it.
          script: "true"

      - name: Start the provisioned Android 35 AVD
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          emulator="$sdk_root/emulator/emulator"
          adb="$sdk_root/platform-tools/adb"
          test -x "$emulator"
          test -x "$adb"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$emulator" -avd test_avd -no-snapshot -no-window -gpu swiftshader_indirect \
            -no-audio -no-boot-anim -read-only > "$RUNNER_TEMP/rustdroid-action-emulator.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if "$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -qx '1'; then
              "$adb" -s emulator-5554 shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          "$adb" devices || true
          tail -n 120 "$RUNNER_TEMP/rustdroid-action-emulator.log" || true
          exit 1

      - id: receipt
        name: Run the checked-in RustDroid action
        uses: ./
        with:
          apk-path: tests/fixtures/apks/launch-success.apk
          profile: host-fast
          runtime-backend: host
          host-avd-name: test_avd
          artifacts-dir: artifacts/action-contract
          duration-secs: "2"
          keep-alive: "false"

      - name: Require the receipt to identify the Android API
        run: jq -e '.emulator.api_level | strings | select(length > 0)' artifacts/action-contract/run-summary.json

      - name: Upload action receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-contract-receipt
          path: ${{ steps.receipt.outputs.receipt-dir || 'artifacts/action-contract' }}
          if-no-files-found: warn

      - name: Stop the contract emulator
        if: always()
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$sdk_root/platform-tools/adb" -s emulator-5554 emu kill || true
