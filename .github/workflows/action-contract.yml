name: action-contract

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 3"

concurrency:
  group: action-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-action-runs-public-fixture:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Provision the documented Android 35 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: test_avd
          profile: pixel_5
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only
          script: emulator -list-avds

      - id: receipt
        name: Run the pinned public RustDroid action
        uses: OthmaneBlial/rustdroid@3f4184ce1117591f9b06cafec48f2ffad1809ecc
        with:
          apk-path: tests/fixtures/apks/launch-success.apk
          profile: host-fast
          runtime-backend: host
          host-avd-name: test_avd
          artifacts-dir: artifacts/action-contract
          duration-secs: "2"
          keep-alive: "false"

      - name: Upload action receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-contract-receipt
          path: ${{ steps.receipt.outputs.receipt-dir }}
          if-no-files-found: warn
