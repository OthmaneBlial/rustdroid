name: host-integration-runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: host-integration-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-integration:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - id: host_suite
        name: Run host runtime and smoke validation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: test_avd
          profile: Nexus 5
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -read-only
          # android-emulator-runner invokes each physical script line in a
          # separate shell. The folded scalar keeps PATH and the smoke
          # environment in one shell invocation.
          script: >-
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}";
            export PATH="$sdk_root/emulator:$sdk_root/platform-tools:$PATH";
            command -v emulator; command -v adb; cargo build --locked;
            RUSTDROID_HOST_TEST_SERIAL=emulator-5554 RUSTDROID_HOST_TEST_AVD=test_avd
            RUSTDROID_CI_HOST_ARTIFACTS_DIR="$GITHUB_WORKSPACE/ci-artifacts/host"
            RUSTDROID_SMOKE_ENABLE_GUI=0 RUSTDROID_SMOKE_BOOT_TIMEOUT_SECS=360
            ./scripts/ci-host-check.sh

      - name: Upload host artifacts on failure
        if: ${{ always() && steps.host_suite.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: host-integration-artifacts
          path: ci-artifacts/host
          if-no-files-found: error

      - id: performance
        name: Check performance baseline
        run: |
          export RUSTDROID_PERF_ARTIFACTS_DIR="$RUNNER_TEMP/rustdroid-performance"
          cargo build --locked
          ./scripts/check-performance-baseline.sh

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-artifacts
          path: ${{ runner.temp }}/rustdroid-performance
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          if [[ -f "ci-artifacts/host/results.env" ]]; then
            source "ci-artifacts/host/results.env"
          fi
          if [[ -f "${RUNNER_TEMP}/rustdroid-performance/bench.json" ]]; then
            export PERF_BENCH_JSON="$(cat "${RUNNER_TEMP}/rustdroid-performance/bench.json")"
          fi

          {
            echo "## Host Integration"
            echo
            echo "- suite step: ${{ steps.host_suite.outcome }}"
            echo "- integration_host_runtime: ${runtime_status:-not-run}"
            echo "- integration_host_backend: ${backend_status:-not-run}"
            echo "- smoke_matrix: ${smoke_status:-not-run}"
            echo "- performance: ${{ steps.performance.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce host validation result
        if: always()
        run: |
          if [[ "${{ steps.host_suite.outcome }}" != "success" ]]; then
            echo "host runtime and smoke validation failed; inspect host-integration-artifacts" >&2
            exit 1
          fi
