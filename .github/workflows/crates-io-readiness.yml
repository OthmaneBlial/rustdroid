name: crates-io-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-before-publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check crates.io readiness without publishing
        run: ./scripts/check-cargo-distribution.sh

      - name: Explain the remaining publish gate
        run: |
          {
            echo "## crates.io readiness"
            echo
            echo "Package validation completed without publishing."
            echo "A maintainer must re-check name availability, create a tagged verified release, and intentionally publish with a scoped token."
          } >> "$GITHUB_STEP_SUMMARY"
